    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 40px 20px;
    }
    .welcome-img {
      display: block;
      width: 300px;
      margin-bottom: 10px;
    }
    .field-wrapper {
      position: relative;
      width: 300px;
      height: 31px;
    }
    .field-wrapper img.textbox-bg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      position: absolute;
      top: 0; left: 0;
    }
    .field-wrapper input {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 12px;
      right: 30px;
      width: auto;
      height: auto;
      background: transparent;
      border: none;
      outline: none;
      padding: 0;
      font-family: 'Alexandria', 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #0F2E50;
      line-height: 1;
    }
    .field-wrapper input::placeholder { color: #5a7fa0; opacity: 1; }
    .field-wrapper .eye-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: auto;
      display: flex;
      align-items: center;
    }
    .field-wrapper .eye-toggle img {
      width: 16px;
      height: 16px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .field-wrapper .eye-toggle:hover img { opacity: 1; }
    .field-wrapper .eye-toggle:hover { background: none; }
    .btn-img {
      display: block;
      width: 300px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-img img { width: 100%; display: block; }
    .btn-img:hover { opacity: 0.88; transform: scale(0.98); background: transparent; }
    .btn-img:active { transform: scale(0.96); background: transparent; }
    .or-img { display: block; width: 300px; }
    .link {
      color: #2F5A84;
      cursor: pointer;
      font-family: 'Alexandria', 'Segoe UI', sans-serif;
      font-size: 13px;
      text-decoration: none;
    }
    .link:hover { text-decoration: underline; }
    p {
      color: #1D4066;
      font-family: 'Alexandria', 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    p a { color: #2F5A84; font-weight: bold; text-decoration: none; }
    p a:hover { text-decoration: underline; }
</style>
