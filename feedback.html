      width: 100%;

      margin-top: 4px;
    }

    .svg-btn.half img { max-width: 100%; width: 100%; }
    .svg-input-wrap {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .input-bg-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      border-radius: 6px;
    }
    .svg-overlay-input {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 12px 14px;
      color: #0F2E50;
      font-family: 'Alexandria', sans-serif;
      font-size: 0.93rem;
      resize: none;
      outline: none;
      box-sizing: border-box;
    }
    .svg-overlay-input::placeholder { color: #5a87aa; }
    .email-input { height: 100%; }
    .textarea-input { overflow-y: auto; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,34,64,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-box {
      background: #DDE6F0;
      border-radius: 14px;
      padding: 28px 20px 24px;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    }
    .modal-question { width: 100%; display: flex; justify-content: center; }
    .modal-question img { width: 100%; max-width: 390px; height: auto; }
    .modal-btn-row {
      display: flex;
      gap: 14px;
      width: 100%;
      justify-content: center;
    }
    .modal-btn-row .svg-btn { flex: 1; max-width: 130px; }
    .modal-btn-row .svg-btn img { width: 100%; height: auto; }
    .success { background: rgba(200,230,201,0.95) !important; }
