<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusCare – Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>
<div class="container">
  <h1>Welcome to CampusCare</h1>
  <input type="email" id="email" placeholder="Sampoerna Email">
  <div class="password-wrapper">
    <input type="password" id="password" placeholder="Enter Password">
    <button class="eye-toggle" type="button" onclick="togglePassword('password', this)" tabindex="-1">
      <img src="images/Open Eye Icon.svg" alt="Show password">
    </button>
  </div>
  <button onclick="signup()">Sign Up</button>
  <p>Already have an account? <a href="login.html">Sign in</a></p>
</div>
</body>
</html>
